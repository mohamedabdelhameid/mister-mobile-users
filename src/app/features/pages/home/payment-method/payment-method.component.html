      <div class="flex flex-col items-center">
        <div
          class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-black font-bold text-xl mb-4"
        >
          1
        </div>
        <h3 class="font-semibold text-lg mb-2">اختر</h3>
        <p class="text-gray-400 text-sm">تصفح مجموعتنا المختارة من أضخم الهواتف العالمية</p>
      </div>

      <div class="flex flex-col items-center">
        <div
          class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-black font-bold text-xl mb-4"
        >
          2
        </div>
        <h3 class="font-semibold text-lg mb-2">احجز</h3>
        <p class="text-gray-400 text-sm">
          أكد طلبك عبر واتساب مع خدمة العملاء الراقية أو من خلال موقعنا
        </p>
      </div>

      <div class="flex flex-col items-center">
        <div
          class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-black font-bold text-xl mb-4"

        </div>

        <p class="text-gray-400 text-sm">استلم، افحص جوالك ثم ادفع</p>
      </div>
    </div>
  </div>
</section>

<section class="bg-black py-10 border-t border-gray-800 overflow-hidden">
  <div class="container mx-auto px-4">
    <p class="text-center text-gray-500 text-sm mb-5 tracking-wide">
      اختر طريقة الدفع المناسبة ليك
    </p>

    <div
      class="flex items-center justify-start sm:justify-center gap-3 overflow-x-auto pb-2 pt-3 scrollbar-hide"
    >
      <div
        class="flex-shrink-0 flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl px-5 py-3 cursor-pointer transition-all duration-300 hover:border-green-500 hover:-translate-y-1"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="6" width="20" height="12" rx="2" fill="#4ade80" />
          <rect x="2" y="10" width="20" height="3" fill="#16a34a" />
          <circle cx="7" cy="15" r="1.5" fill="#16a34a" />
        </svg>

        <span class="text-gray-200 text-sm font-medium whitespace-nowrap"> كاش </span>
      </div>

      <div
        class="flex-shrink-0 flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl px-5 py-3 cursor-pointer transition-all duration-300 hover:border-green-500 hover:-translate-y-1"
      >
        <img src="/instapay.png" alt="إنستاباي" class="w-6 h-6 object-contain" />

        <span class="text-gray-200 text-sm font-medium whitespace-nowrap"> إنستاباي </span>
      </div>

      <div
        (click)="openInstallment('contact-now')"
        class="flex-shrink-0 flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl px-5 py-3 cursor-pointer transition-all duration-300 hover:border-green-500 hover:-translate-y-1"
      >
        <img src="/contact-now.png" alt="كونتاكت ناو" class="w-6 h-6 object-contain" />

        <span class="text-gray-200 text-sm font-medium whitespace-nowrap"> كونتاكت ناو </span>
      </div>

      <div
        (click)="openInstallment('valU')"
        class="flex-shrink-0 flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl px-5 py-3 cursor-pointer transition-all duration-300 hover:border-orange-500 hover:-translate-y-1"
      >
        <img src="/valU.png" alt="فاليو" class="w-6 h-6 object-contain" />

        <span class="text-gray-200 text-sm font-medium whitespace-nowrap"> فاليو </span>
      </div>

      <div
        (click)="openInstallment('mylo')"
        class="flex-shrink-0 flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl px-5 py-3 cursor-pointer transition-all duration-300 hover:border-pink-500 hover:-translate-y-1"
      >
        <img src="/mylo.png" alt="مايلو" class="w-6 h-6 object-contain" />

        <span class="text-gray-200 text-sm font-medium whitespace-nowrap"> مايلو </span>
      </div>

      <div
        (click)="openInstallment('Sympl')"
        class="flex-shrink-0 flex items-center gap-2 bg-gray-900 border border-gray-800 rounded-xl px-5 py-3 cursor-pointer transition-all duration-300 hover:border-fuchsia-500 hover:-translate-y-1"
      >
        <img src="/sympl.png" alt="سيمبل" class="w-6 h-6 object-contain" />

        <span class="text-gray-200 text-sm font-medium whitespace-nowrap"> سيمبل </span>
      </div>
    </div>
  </div>
</section>
